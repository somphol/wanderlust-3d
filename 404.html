<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lost the trail — Wanderlust 3D</title>
  <meta name="robots" content="noindex">
  <style>
    :root { color-scheme: light; --ink:#17251f; --paper:#f7f2e8; --emerald:#0d3b2e; --sunset:#e8794f; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100svh; display:grid; place-items:center; padding:2rem; background:var(--paper); color:var(--ink); font-family:"Avenir Next",Avenir,"Segoe UI",system-ui,sans-serif; }
    main { max-width: 540px; text-align:center; }
    .mark { width:72px; height:72px; margin:0 auto 1.5rem; display:grid; place-items:center; border:1px solid var(--ink); border-radius:50%; }
    .mark svg { width:36px; height:36px; fill:none; stroke:currentColor; stroke-width:1.5; }
    .kicker { font-size:.65rem; font-weight:800; letter-spacing:.2em; text-transform:uppercase; color:var(--emerald); }
    h1 { margin:.7rem 0 0; font-family:"Iowan Old Style",Palatino,Georgia,serif; font-size:clamp(2.8rem,8vw,4.6rem); font-weight:500; line-height:.95; letter-spacing:-.03em; }
    h1 em { color:var(--emerald); font-weight:400; }
    p { margin:1.2rem auto 0; max-width:42ch; color:#4d5c53; line-height:1.7; }
    a { display:inline-flex; align-items:center; gap:.5rem; margin-top:1.8rem; padding:.8rem 1.3rem; border-radius:999px; background:var(--emerald); color:#fff; text-decoration:none; font-size:.8rem; font-weight:800; letter-spacing:.06em; text-transform:uppercase; }
    a:hover { background:#165942; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg>
    </div>
    <p class="kicker">404 · Off the map</p>
    <h1>This trail<br><em>goes nowhere.</em></h1>
    <p>The page you were looking for has moved, or never existed. The atlas is still open — fifteen destinations are waiting.</p>
    <a href="./">Back to Wanderlust 3D</a>
  </main>
</body>
</html>
